{% extends 'base.html' %}
{# criar.html — Formulário de criação de evento (SPEC seção 8.7) #}

{% block title %}Criar Evento — EventoIFS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0">
            <div class="card-body p-4">

                <h1 class="h4 fw-bold mb-4">
                    <i class="bi bi-plus-circle me-2 text-ifs"></i>Criar novo evento
                </h1>

                <form method="post" action="{% url 'criar_evento' %}" id="form-criar-evento" novalidate>
                    {% csrf_token %}
                    {% include 'eventos/_form_evento.html' %}

                    <div class="d-flex gap-2 justify-content-end mt-4">
                        <a href="{% url 'lista_eventos' %}" class="btn btn-outline-secondary">
                            <i class="bi bi-x me-1"></i> Cancelar
                        </a>
                        <button type="submit" class="btn btn-ifs">
                            <i class="bi bi-check-lg me-1"></i> Criar Evento
                        </button>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>
{% endblock %}
